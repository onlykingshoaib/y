services:
  - type: web
    name: youtube-studio-pro
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:asgi_app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.12.15
